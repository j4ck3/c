# Netdata — https://netdata.hjacke.com (Traefik) and https://netdata.netbird.hjacke.com (Caddy)
# Custom "main" dashboard: run provision/apply-main-dashboard.sh, then open /custom/provision-main.html once.
# No ports published; Traefik reaches Netdata via npm_services.

services:
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    hostname: netdata
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - /mnt/cache/appdata/netdata:/etc/netdata:rw
      - /mnt/cache/appdata/netdata/web/custom:/usr/share/netdata/web/custom:ro
      - /mnt/cache/appdata/netdata/charts.d/uptime_days.chart.sh:/usr/libexec/netdata/charts.d/uptime_days.chart.sh:ro
      - /mnt/cache/appdata/netdata/charts.d/charts.d.plugin.conf:/etc/netdata/charts.d.plugin.conf:ro
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - npm_services
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=npm_services"
      - "traefik.http.routers.netdata.rule=Host(`netdata.hjacke.com`)"
      - "traefik.http.routers.netdata.entrypoints=websecure"
      - "traefik.http.routers.netdata.tls=true"
      - "traefik.http.routers.netdata.tls.certresolver=letsencrypt"
      - "traefik.http.routers.netdata.service=netdata"
      - "traefik.http.routers.netdata-netbird.rule=Host(`netdata.netbird.hjacke.com`)"
      - "traefik.http.routers.netdata-netbird.entrypoints=websecure"
      - "traefik.http.routers.netdata-netbird.tls=true"
      - "traefik.http.routers.netdata-netbird.tls.certresolver=letsencrypt"
      - "traefik.http.routers.netdata-netbird.middlewares=netbird-only@file"
      - "traefik.http.routers.netdata-netbird.service=netdata"
      - "traefik.http.services.netdata.loadbalancer.server.port=19999"
      # HTTP → HTTPS (public hostname only)
      - "traefik.http.routers.netdata-http.rule=Host(`netdata.hjacke.com`)"
      - "traefik.http.routers.netdata-http.entrypoints=web"
      - "traefik.http.routers.netdata-http.middlewares=redirect-https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"

volumes:
  netdata_lib:
    name: netdata_lib
  netdata_cache:
    name: netdata_cache

networks:
  npm_services:
    external: true
