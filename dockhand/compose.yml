services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    # Reachable on the tower NetBird IP (remote peers). Do not use 0.0.0.0:3000.
    ports:
      - "127.0.0.1:3000:3000"
      - "100.113.194.104:3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/user/appdata/dockhand/data:/app/data
    networks:
      - npm_services
    labels:
      - "traefik.enable=false"
      - "dockhand.url=https://dockhand.netbird.hjacke.com"
      - "net.unraid.docker.icon=https://avatars.githubusercontent.com/u/80454229?s=48&v=4"
    environment:
      - TZ=Europe/Stockholm
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  npm_services:
    external: true
