services:
  watchtower:
    build:
      context: .
      dockerfile: Dockerfile
    image: watchtower-defer:local
    container_name: watchtower
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=Europe/Stockholm
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_CLEANUP=true
      # Only explicitly labelled, noncritical containers may be updated.
      - WATCHTOWER_LABEL_ENABLE=true
      # Weekly: Wednesday 06:30, clear of 03:00 backups, 04:00 GoBackup,
      # daily/weekly cron around 04:30, and Sunday's 05:00 mover/parity jobs.
      - WATCHTOWER_SCHEDULE=0 30 6 * * 3
      # Skip images newer than ~1.5 days (PR build only supports whole days; 2 = conservative).
      - WATCHTOWER_DEFER_DAYS=2
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_INCLUDE_RESTARTING=false
      - WATCHTOWER_ROLLING_RESTART=false
      - DOCKER_CONFIG=/config
      # HTTP API disabled until WATCHTOWER_API_TOKEN is set in .env
      - WATCHTOWER_HTTP_API_UPDATE=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/.docker:/config:ro
    restart: unless-stopped
