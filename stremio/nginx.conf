server {
    listen 8090;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    location = / {
        if ($arg_streamingServerUrl = "") {
            return 302 https://m.hjacke.com/?streamingServerUrl=https%3A%2F%2Fm.hjacke.com%2F;
        }
        try_files $uri /index.html;
    }

    location ~ ^/(casting|local-addon|proxy|settings|create|removeAll|samples|probe|subtitlesTracks|opensubHash|subtitles|network-info|device-info|get-https|hwaccel-profiler|status|exec|stream|heartbeat|yt|tracks|hlsv2|rar|zip|7zip|tar|tgz|ftp|nzb|metrics|list|bitmagnet|torznab)(/|$) {
        proxy_pass http://127.0.0.1:11470;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ "^/[0-9a-fA-F]{40}/(scripts|styles|binaries)/" {
        try_files $uri =404;
    }

    location ~ "^/[0-9a-fA-F]{40}(/|$)" {
        proxy_pass http://127.0.0.1:11470;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
