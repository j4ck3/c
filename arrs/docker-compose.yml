services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - /mnt/user/appdata/sonarr/config:/config
      - /mnt/cache/media/TV:/tv
      - /mnt/user/downloads/qbitorrent:/downloads
    networks:
      - npm_services
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=npm_services"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.netbird.hjacke.com`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.routers.sonarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sonarr.middlewares=netbird-only@file"
      - "traefik.http.routers.sonarr.service=sonarr"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    environment:
      - PUID=99
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - /mnt/user/appdata/binhex-radarr:/config
      - /mnt/cache/media/Movies:/movies
      - /mnt/user/downloads/qbitorrent:/downloads
    networks:
      - npm_services
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=npm_services"
      - "traefik.http.routers.radarr.rule=Host(`radarr.netbird.hjacke.com`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.routers.radarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.radarr.middlewares=netbird-only@file"
      - "traefik.http.routers.radarr.service=radarr"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    hostname: bazarr
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - /mnt/user/appdata/bazarr/config:/config
      - /mnt/cache/media:/media
    networks:
      - npm_services
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=npm_services"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.netbird.hjacke.com`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.routers.bazarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bazarr.middlewares=netbird-only@file"
      - "traefik.http.routers.bazarr.service=bazarr"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
    restart: unless-stopped

  # lidarr and prowlarr: ported from Unraid dockerMan templates (my-lidarr.xml,
  # my-prowlarr.xml). Prowlarr syncs indexers to sonarr/radarr/lidarr by
  # container name on npm_services. Lidarr reaches qBittorrent at 10.0.0.24:8080.
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    hostname: lidarr
    environment:
      - PUID=99
      - PGID=100
      - UMASK=022
      - TZ=Europe/Berlin
    ports:
      - "8686:8686"
    volumes:
      - /mnt/user/appdata/lidarr:/config
      - /mnt/user/music:/music
      - /mnt/user/downloads:/downloads
    networks:
      - npm_services
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    environment:
      - PUID=99
      - PGID=100
      - UMASK=022
      - TZ=Europe/Berlin
    ports:
      - "9696:9696"
    volumes:
      - /mnt/user/appdata/prowlarr:/config
    networks:
      - npm_services
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    hostname: seerr
    restart: unless-stopped
    networks:
      - npm_services
    ports:
      - "5055:5055"
    volumes:
      - /mnt/user/appdata/overseerr:/app/config
      - /mnt/cache/media:/media
    environment:
      - TZ=Etc/UTC
      - PORT=5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr-filmen.rule=Host(`filmen.hjacke.com`)"
      - "traefik.http.routers.seerr-filmen.entrypoints=websecure"
      - "traefik.http.routers.seerr-filmen.tls=true"
      - "traefik.http.routers.seerr-filmen.tls.certresolver=letsencrypt"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"

networks:
  npm_services:
    external: true
