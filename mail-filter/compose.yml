services:
  mail-filter:
    image: python:3.12-alpine@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
    container_name: mail-filter
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python3", "/app/mail_filter.py", "--loop", "300"]
    environment:
      # POSIX rule: tower's zoneinfo has no Europe/Stockholm file.
      TZ: CET-1CEST,M3.5.0,M10.5.0/3
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      OTP_CLEANUP_DIR: /otp
      OTP_CLIENT_ID_FILE: /run/client_id
      MF_DIR: /data
    volumes:
      - ./mail_filter.py:/app/mail_filter.py:ro
      # Shared refresh token and OAuth helpers from the otp-cleanup job.
      - /mnt/cache/appdata/otp-cleanup:/otp
      - /mnt/cache/appdata/mail-filter:/data
      - /mnt/cache/appdata/roundcube/secrets/microsoft_client_id:/run/client_id:ro
    tmpfs:
      - /tmp:size=8m
    labels:
      traefik.enable: "false"
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
