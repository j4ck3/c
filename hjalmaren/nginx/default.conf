server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/geo+json text/css application/javascript image/svg+xml application/x-protobuf;

    # Vektorkakel, typsnitt och sprite andras bara nar datat byts ut.
    # OBS: ingen "always" - ett 404 far aldrig cachas som immutable.
    # .mvt saknas i nginx mime.types och blev application/octet-stream, som inte gzippas.
    # Kaklen kraver inget annat: MapLibre lasar dem som binardata oavsett typ.
    location ~* ^/tiles/ {
        types { application/x-protobuf mvt; }
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location ~* ^/glyphs/ {
        types { application/x-protobuf pbf; }
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location ~* ^/(sprite|sprite-v2)/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    # MapLibre 6 levereras som ES-moduler (.mjs). Webblasare vagrar ladda en modul som
    # inte har en JavaScript-typ, och .mjs saknas i nginx mime.types.
    # Versionen ligger i katalognamnet (vendor/v6.17.0/), sa immutable ar ofarligt.
    location ~* ^/vendor/ {
        types { application/javascript js mjs; text/css css; text/plain txt; }
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    # Gamla versioner och arbetsfiler ska inte kunna nas via webben.
    location ~* (\.bak|\.bak-[^/]*|\.tmp|~)$ { return 404; }

    # Sidan och dess data ska aldrig serveras fran cache.
    location = / {
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    location ~* \.(html)$ {
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    location ~* \.(json|geojson)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
