server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /lokalt {
        return 301 /lokalt/;
    }
    location /lokalt/ {
        alias /usr/share/nginx/lokalt/;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
