services:
  codeberg-runner:
    image: data.forgejo.org/forgejo/runner:12
    container_name: codeberg-runner
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:-281}"
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - /mnt/user/appdata/codeberg-runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner-config.yaml:/config.yaml:ro
      - ./secrets/runner-token:/secrets/runner-token:ro
    command: forgejo-runner daemon --config /config.yaml
