log:
  level: info
  job_level: info

runner:
  file: /data/.runner
  capacity: 2
  timeout: 3h
  fetch_timeout: 30s
  fetch_interval: 2s

cache:
  enabled: true
  dir: /data/cache

container:
  docker_host: automount
  privileged: false
  force_pull: true

server:
  connections:
    codeberg:
      url: https://codeberg.org/
      uuid: d10d0de0-5312-43ed-929f-114d1ab85a03
      token_url: file:///secrets/runner-token
      labels:
        - docker:docker://docker.io/library/node:lts
        - ubuntu-latest:docker://docker.io/library/node:lts
