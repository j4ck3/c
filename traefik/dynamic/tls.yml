tls:
  stores:
    default:
      # Default cert (fallback when no SNI match). Use existing cert; hjacke.com uses letsencrypt resolver.
      defaultCertificate:
        certFile: /etc/traefik/certs/rjhdesign_cloudflare_origin_cert.pem
        keyFile: /etc/traefik/certs/rjhdesign_cloudflare_origin_key.pem
  certificates:
    # Certificates that exist in /etc/traefik/certs. hjacke.com uses certresolver=letsencrypt in router labels.
    - certFile: /etc/traefik/certs/rjhdesign_cloudflare_origin_cert.pem
      keyFile: /etc/traefik/certs/rjhdesign_cloudflare_origin_key.pem
    - certFile: /etc/traefik/certs/cloudflare_origin_cert.pem
      keyFile: /etc/traefik/certs/cloudflare_origin_cert_private.pem
