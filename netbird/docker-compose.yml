# Netbird VPN mesh stack (combined netbird-server + dashboard)
# Based on: https://github.com/netbirdio/netbird (combined container, v0.65.0+)
# Docs: https://docs.netbird.io/selfhosted/external-reverse-proxy#combined-container-setup-v0650
# Routing for netbird.hjacke.com is in ../traefik/dynamic/netbird.yml (file provider).
# UDP 3478 must be reachable on the host for STUN (NAT traversal).

x-default: &default
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "500m"
      max-file: "2"

services:
  netbird-dashboard:
    <<: *default
    image: netbirdio/dashboard:latest
    container_name: netbird-dashboard
    env_file:
      - ./dashboard.env
    networks:
      - npm_services
    ports:
      - "8080:80"

  netbird-server:
    <<: *default
    image: netbirdio/netbird-server:latest
    container_name: netbird-server
    networks:
      - npm_services
    ports:
      - "3478:3478/udp"
    volumes:
      - netbird_data:/var/lib/netbird
      - ./config.yaml:/etc/netbird/config.yaml:ro
    command: ["--config", "/etc/netbird/config.yaml"]

  # Do not run `docker run netbirdio/netbird` for debugging — entrypoint blocks ~30s+.
  # Use: docker exec netbird-client netbird status  (with timeout if needed)
  netbird-client:
    image: netbirdio/netbird:latest
    container_name: netbird-client
    hostname: ${NETBIRD_CLIENT_HOSTNAME}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun
    network_mode: host
    extra_hosts:
      # Traefik on npm_services — required for management API reachability from host network.
      - "netbird.hjacke.com:172.25.0.254"
    environment:
      - NB_SETUP_KEY=${NB_SETUP_KEY:?Set NB_SETUP_KEY in .env or environment}
      - NB_MANAGEMENT_URL=https://netbird.hjacke.com/
      # Avoid NetBird pointing resolv.conf at the local mesh DNS (100.x); when relay/tunnel
      # is down, that breaks resolving the management URL and prevents recovery.
      - NB_DISABLE_DNS=true
      - NB_ALLOW_SERVER_SSH=true
      # Use machine identity (ACL-only); omit if you use IdP/JWT for SSH
      - NB_DISABLE_SSH_AUTH=true
      # Required so mesh SSH accepts root (Unraid) and SFTP for stack copy
      - NB_ENABLE_SSH_ROOT=true
      - NB_ENABLE_SSH_SFTP=true
    volumes:
      - netbird_client_data:/var/lib/netbird
    depends_on:
      - netbird-server
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "2"

  # HTTPS for *.netbird.hjacke.com on the mesh IP (requires netbird-client connected).
  dockhand-netbird-proxy:
    image: dockhand-caddy-cloudflare:local
    container_name: dockhand-netbird-proxy
    <<: *default
    env_file:
      - ../traefik/.env.local
    ports:
      - "100.113.194.104:80:80"
      - "100.113.194.104:443:443"
    volumes:
      - ./dockhand-netbird.Caddyfile:/etc/caddy/Caddyfile:ro
      - dockhand_caddy_data:/data
      - dockhand_caddy_config:/config
    networks:
      - npm_services
    depends_on:
      - netbird-client

  # Docker bridge packets hit host iptables (br_netfilter). Netbird
  # rebuilds FORWARD on peer churn and Caddy then cannot dial Trilium.
  netbird-docker-protect:
    <<: *default
    image: alpine:3.20
    container_name: netbird-docker-protect
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - /mnt/user/documents/compose/netbird/protect-docker-bridge.sh:/protect-docker-bridge.sh:ro
    command:
      - /bin/sh
      - -c
      - apk add --no-cache iptables >/dev/null && exec sh /protect-docker-bridge.sh

volumes:
  netbird_data:
    name: netbird_data
  netbird_client_data:
    name: netbird_client_data
  dockhand_caddy_data:
  dockhand_caddy_config:

networks:
  npm_services:
    external: true
