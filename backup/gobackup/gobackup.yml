# GoBackup config - complementary backup layer (Web UI, archive, notifications)
# See: https://gobackup.github.io/configuration

# Build temp archives on the cache-mounted volume, NOT inside the container
# filesystem (which lives in docker.img). Writing the temp tarball into
# docker.img was filling it to 100% every run.
workdir: /backups/gobackup/tmp

web:
  host: 0.0.0.0
  port: 2703
  username: admin
  password: $GOBACKUP_WEB_PASSWORD

models:
  unraid_configs:
    description: "Archive important Unraid configs and compose files"
    schedule:
      cron: "0 4 * * *"
    compress_with:
      type: tgz
    archive:
      includes:
        - /data/documents/compose
        - /data/system
      excludes:
        - "*.tmp"
        - "*.log"
        - node_modules
        - .git
        # Never archive disk images. The system share contains docker.img
        # (~200 GB) and libvirt.img; taring them is pointless and was the
        # root cause of the daily docker.img 100% utilization alerts.
        - "*.img"
    storages:
      local:
        type: local
        keep: 14
        path: /backups/gobackup
    notifiers:
      telegram:
        type: telegram
        token: $TELEGRAM_BOT_TOKEN
        chat_id: $TELEGRAM_CHAT_ID
