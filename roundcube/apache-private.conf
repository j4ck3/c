ServerName mail.netbird.hjacke.com

<VirtualHost *:8000>
    ServerName mail.netbird.hjacke.com
    DocumentRoot /var/www/html/public_html
    ServerAdmin webmaster@localhost

    <Directory /var/www/html/public_html>
        Options -Indexes
        AllowOverride All
        # Accept only the private HTTPS proxy (static IP set in netbird/docker-compose.yml) and the in-container health check.
        Require ip 172.25.0.23 127.0.0.1
    </Directory>

    LimitRequestBody 31457280
    ErrorLog ${APACHE_LOG_DIR}/error.log
    # Do not log OAuth callback query strings, referrers, or authorization headers.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" private_mail
    CustomLog ${APACHE_LOG_DIR}/access.log private_mail
</VirtualHost>
