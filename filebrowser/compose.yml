# FileBrowser Quantum (gtsteffaniak/filebrowser) — stable v1.5.x line.
# Mesh-only via NetBird: https://files.netbird.hjacke.com
# Routing lives in ../netbird/dockhand-netbird.Caddyfile (dockhand-netbird-proxy).
# Deliberately no host ports and no Traefik labels: the container is only
# reachable from the NetBird tailnet through the Caddy proxy on npm_services.
# Old filebrowser/filebrowser:s6 database and settings were not migrated
# (incompatible formats); originals kept at:
#   /mnt/cache/appdata/filebrowser/filebrowser.db
#   /mnt/user/appdata/filebrowser/settings.json
services:
  filebrowser:
    image: gtstef/filebrowser:stable
    container_name: filebrowser
    hostname: filebrowser
    restart: unless-stopped
    # Same UID/GID the old linuxserver-style container used (PUID 1000 / PGID 100).
    user: "1000:100"
    env_file:
      - .env
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - /mnt/cache:/srv
      # Config + database.db + cacheDir all persist here (docker default path).
      - ./data:/home/filebrowser/data
    networks:
      - npm_services

networks:
  npm_services:
    external: true
