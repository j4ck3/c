# FileBrowser Quantum (v1.5.x stable) configuration.
# Docs: https://filebrowserquantum.com/en/docs/getting-started/config-v1.5.x/
server:
  cacheDir: /home/filebrowser/data/tmp
  sources:
    - path: /srv
      config:
        defaultEnabled: true

auth:
  adminUsername: admin
  # Password is injected via FILEBROWSER_ADMIN_PASSWORD from ../.env
  # (applied when the admin user is first created, i.e. empty database).
