configs:
  trilium-ts-serve:
    content: |
      {
        "TCP": {
          "443": { "HTTPS": true }
        },
        "Web": {
          "${TS_CERT_DOMAIN}:443": {
            "Handlers": {
              "/": {
                "Proxy": "http://trilium:8080"
              }
            }
          }
        },
        "AllowFunnel": {
          "${TS_CERT_DOMAIN}:443": false
        }
      }

services:
  trilium:
    image: triliumnext/trilium:v0.105.0
    container_name: trilium
    restart: unless-stopped
    environment:
      - TRILIUM_DATA_DIR=/home/node/trilium-data
    volumes:
      - /mnt/user/trilium:/home/node/trilium-data
    networks:
      npm_services:
        # Pinned: Docker had given Trilium and gluetun_torrents the same MAC on
        # npm_services, so the bridge flapped between their ports (502s).
        mac_address: "02:7e:17:00:00:0f"
      trilium-internal: {}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=npm_services"
      - "traefik.http.routers.trilium.rule=Host(`trilium.hjacke.com`)"
      - "traefik.http.routers.trilium.entrypoints=websecure"
      - "traefik.http.routers.trilium.tls=true"
      - "traefik.http.routers.trilium.tls.certresolver=letsencrypt"
      - "traefik.http.routers.trilium.service=trilium"
      - "traefik.http.routers.trilium-netbird.rule=Host(`trilium.netbird.hjacke.com`)"
      - "traefik.http.routers.trilium-netbird.entrypoints=websecure"
      - "traefik.http.routers.trilium-netbird.tls=true"
      - "traefik.http.routers.trilium-netbird.tls.certresolver=letsencrypt"
      - "traefik.http.routers.trilium-netbird.middlewares=netbird-only@file"
      - "traefik.http.routers.trilium-netbird.service=trilium"
      - "traefik.http.services.trilium.loadbalancer.server.port=8080"
      - "traefik.http.services.trilium.loadbalancer.server.scheme=http"

  trilium-ts:
    image: tailscale/tailscale:latest
    container_name: trilium-ts
    hostname: trilium-ts
    restart: unless-stopped
    depends_on:
      - trilium
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    configs:
      - source: trilium-ts-serve
        target: /config/serve.json
    volumes:
      - trilium-ts-state:/var/lib/tailscale
    networks:
      - trilium-internal

volumes:
  trilium-ts-state:

networks:
  npm_services:
    external: true
  trilium-internal: